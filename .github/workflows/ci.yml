name: RSCD CI

# Runs against the PUBLISHED BUNDLE tree (this repo root == Outputs/Publish/ mirror):
#   replicator/  code/  chopped/  series_registry.json  requirements.txt
# NOTE: paths are bundle-root relative (NOT Technical/…) — the old workflow
# referenced Technical/… which does not exist in the bundle, so every step
# silently no-op'd. All `|| true` masks are removed: a real failure fails CI.

on: [push, pull_request]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install replicator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r replicator/requirements.txt

      - name: Replicator health + script inventory
        run: |
          python replicator/scripts/replicate.py --health
          python replicator/scripts/replicate.py --list

      - name: Bundle leak audit (paths + secrets)
        run: |
          cat > _bundle_audit.py <<'PY'
          import re, sys
          from pathlib import Path
          ROOT = Path(".")
          EXTS = {".py", ".md", ".json", ".csv", ".txt", ".yml", ".yaml", ".cff", ".ipynb"}
          # FAIL-severity per anu-framework.md: absolute workspace paths + real API keys.
          PATH_LEAK = re.compile(r"D:[\\/]Arcanum|/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/Arcanum")
          KEY_LEAK  = re.compile(r"(FRED|BEA|CENSUS)_API_KEY\s*=\s*[A-Za-z0-9]{16,}")
          hits = []
          for p in ROOT.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in EXTS:
                  continue
              if ".git" in p.parts or "workdir" in p.parts:
                  continue
              try:
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for i, line in enumerate(text.splitlines(), 1):
                  if PATH_LEAK.search(line):
                      hits.append(f"PATH_LEAK  {p}:{i}: {line.strip()[:120]}")
                  if KEY_LEAK.search(line):
                      hits.append(f"KEY_LEAK   {p}:{i}: <redacted>")
          if hits:
              print(f"Bundle audit FAILED — {len(hits)} leak(s):")
              for h in hits[:50]:
                  print("  " + h)
              sys.exit(1)
          print("Bundle audit clean — no workspace-path or API-key leaks.")
          PY
          python _bundle_audit.py
